version: '3.8'

services:
  # Rustling HTTP Server (duckling-rust)
  rustling:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustling-server:latest
    container_name: rustling-server
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - BIND_ADDRESS=0.0.0.0:8080
      - RELOAD_API_KEY=${RELOAD_API_KEY:-}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rustling-network

  # Haskell Duckling (for comparison)
  haskell-duckling:
    image: ghcr.io/facebookincubator/duckling:latest
    container_name: haskell-duckling
    ports:
      - "8081:8080"
    command: ["duckling"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - rustling-network

networks:
  rustling-network:
    driver: bridge
