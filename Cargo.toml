[package]
name = "rustling"
version = "0.10.0"
authors = ["hdlj <hubert.delajonquiere@snips.net>", "Mathieu Poumeyrol <kali@zoy.org>"]
edition = "2021"
rust-version = "1.70"

[workspace]
members = ["core", "ml"]

[dependencies]
rustling-core = { path = "core" }
rustling-ml = { path = "ml" }
thiserror = "1.0"
fnv = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
finalfusion = { version = "0.17", optional = true }
dirs = { version = "5.0", optional = true }
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
utoipa = { version = "5.3", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "8.1", features = ["actix-web"] }
tera = { version = "1.19", optional = true }
lazy_static = "1.4"  # Required for language rules (dictionaries)
glob = { version = "0.3", optional = true }

[features]
default = []
apollo = ["reqwest"]
fasttext = ["finalfusion", "dirs", "reqwest"]
migration-tools = ["tera", "glob"]

[dev-dependencies]
criterion = "0.5"
futures = "0.3"

[[bench]]
name = "parser_bench"
harness = false

[[bin]]
name = "codegen"
path = "tools/migration/codegen.rs"
required-features = ["migration-tools"]
